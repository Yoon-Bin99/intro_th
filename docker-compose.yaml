services:

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}   # 관리자 root 비밀번호
      MYSQL_DATABASE: introdb
      MYSQL_USER: intern                                   # 앱 전용 일반 계정
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}         # intern 계정 비밀번호
    ports:
      - "3307:3307"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/introdb
      SPRING_DATASOURCE_USERNAME: intern                     # db의 MYSQL_USER와 같게
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-intern1234}   # db의 MYSQL_PASSWORD와 같은 변수
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  db-data: